services:
  soc-web:
    image: nginx:alpine
    container_name: soc-web
    restart: always
    ports:
      - "8080:80"
    networks:
      - soc-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - soc-network

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - soc-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - soc-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - soc-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    networks:
      - soc-network
    depends_on:
      - loki

networks:
  soc-network:
    driver: bridge
