server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: authlog
    static_configs:
      - targets:
          - localhost
        labels:
          job: authlog
          host: ubuntu-server
          __path__: /var/log/auth.log

  - job_name: ufwlog
    static_configs:
      - targets:
          - localhost
        labels:
          job: ufwlog
          host: ubuntu-server
          __path__: /var/log/ufw.log
